<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Page & To-Do List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    min-height:100vh;
    padding:20px;
}

/* Navigation */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#ffffff;
    padding:15px 25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.navbar h2{
    color:#2575fc;
}

.navbar ul{
    display:flex;
    list-style:none;
}

.navbar ul li{
    margin-left:20px;
}

.navbar ul li a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.navbar ul li a:hover{
    color:#2575fc;
}

/* Card Sections */
.form-section,
.todo-section{
    background:#fff;
    max-width:650px;
    margin:25px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.form-section h2,
.todo-section h2{
    text-align:center;
    color:#2575fc;
    margin-bottom:20px;
}

form{
    display:flex;
    flex-direction:column;
}

input{
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2575fc;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#174bb5;
}

.error{
    color:red;
    font-size:13px;
    margin-top:3px;
}

/* Grid */
.grid-container{
    max-width:700px;
    margin:25px auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.box{
    background:linear-gradient(45deg,#00c9ff,#92fe9d);
    padding:40px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    border-radius:12px;
}
/* Center To-Do List */
.todo-section{
    text-align:center;
}

#taskInput{
    width:70%;
    max-width:400px;
}

#taskList{
    margin-top:20px;
    padding:0;
}

#taskList li{
    list-style:none;
    background:#f2f2f2;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn:hover{
    background:darkred;
}

@media(max-width:768px){
    .navbar{
        flex-direction:column;
    }

    .navbar ul{
        margin-top:10px;
    }

    .grid-container{
        grid-template-columns:1fr;
    }

    #taskInput{
        width:100%;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <h2>My Website</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="form-section">

<h2>Contact Form</h2>

<form id="contactForm">

<input type="text" id="name" placeholder="Enter Name">
<span class="error" id="nameError"></span>

<input type="email" id="email" placeholder="Enter Email">
<span class="error" id="emailError"></span>

<input type="tel" id="mobile" placeholder="Enter Mobile Number">
<span class="error" id="mobileError"></span>

<button type="submit">
Submit
</button>

</form>

</section>

<section class="grid-container">
<div class="box">Portfolio</div>
<div class="box">Services</div>
<div class="box">Projects</div>
<div class="box">Contact</div>
</section>

<section class="todo-section">

<h2>To-Do List</h2>

<input type="text"
id="taskInput"
placeholder="Enter Task">

<button onclick="addTask()">
Add Task
</button>

<ul id="taskList"></ul>

</section>

<script>
    // Contact Form Validation
document.getElementById("contactForm").addEventListener("submit", function(e){

    e.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();

    let valid = true;

    document.getElementById("nameError").innerText = "";
    document.getElementById("emailError").innerText = "";
    document.getElementById("mobileError").innerText = "";

    if(name === ""){
        document.getElementById("nameError").innerText =
        "Name is required";
        valid = false;
    }

    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/i;

    if(!email.match(emailPattern)){
        document.getElementById("emailError").innerText =
        "Enter a valid email";
        valid = false;
    }

    let mobilePattern = /^[0-9]{10}$/;

    if(!mobile.match(mobilePattern)){
        document.getElementById("mobileError").innerText =
        "Enter a valid 10-digit mobile number";
        valid = false;
    }

    if(valid){
        alert("Form Submitted Successfully!");
        document.getElementById("contactForm").reset();
    }
});

// To-Do List
function addTask(){

    let taskInput = document.getElementById("taskInput");
    let task = taskInput.value.trim();

    if(task === ""){
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");

    li.innerHTML = `
        <span>${task}</span>
        <button class="delete-btn"
        onclick="this.parentElement.remove()">
            Delete
        </button>
    `;

    document.getElementById("taskList").appendChild(li);

    taskInput.value = "";
}

</script>

</body>
</html>
